<h2 class="title">8-Stack Training Plan</h2>

<table mat-table [dataSource]="rows" class="stack-table">
  <ng-container matColumnDef="stack">
    <th mat-header-cell *matHeaderCellDef class="stack-col">Stack</th>
    <td mat-cell *matCellDef="let row" class="stack-col">{{ row.stack }}</td>
  </ng-container>

  <ng-container matColumnDef="isolated">
    <th mat-header-cell *matHeaderCellDef>Isolated Floor Exercises</th>
    <td mat-cell *matCellDef="let row">{{ row.isolated }}</td>
  </ng-container>

  <ng-container matColumnDef="mobility">
    <th mat-header-cell *matHeaderCellDef>Mobility Floor Exercises</th>
    <td mat-cell *matCellDef="let row">{{ row.mobility }}</td>
  </ng-container>

  <ng-container matColumnDef="kneeling">
    <th mat-header-cell *matHeaderCellDef>Kneeling transitions</th>
    <td mat-cell *matCellDef="let row">{{ row.kneeling }}</td>
  </ng-container>

  <ng-container matColumnDef="integrated">
    <th mat-header-cell *matHeaderCellDef>Integrated Standing Exercises</th>
    <td mat-cell *matCellDef="let row">{{ row.integrated }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
